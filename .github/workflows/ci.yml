name: Node.js CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - name: Package educational staging build
        run: tar -czf fitness-app-staging.tar.gz src public package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-app-staging
          path: fitness-app-staging.tar.gz
