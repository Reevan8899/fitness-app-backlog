name: Assign bugs to owner
on:
  issues:
    types: [labeled]
permissions:
  issues: write
jobs:
  assign:
    if: github.event.label.name == 'bug'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              ...context.repo,
              issue_number: context.issue.number,
              assignees: ['Reevan8899']
            });
